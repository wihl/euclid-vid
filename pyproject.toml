[project]
name = "euclid-video"
version = "0.1.0"
description = "Reproducible Euclid I.12 video alignment and render"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "soundfile>=0.12",
  "torch>=2.4,<3",
  "transformers>=4.40,<5",
]

[project.scripts]
euclid-video = "euclid_video:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["euclid_video.py"]
